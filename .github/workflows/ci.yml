name: Sanchay AI — CI & Quality Gate

on:
  push:
    branches: [ main, "hardening/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-ml-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio Faker

      - name: Run Data Contract & Feature Consistency Tests
        run: |
          pytest tests/test_data_contract.py -v

      - name: Run Full Test Suite
        run: |
          pytest tests backend/tests -v
